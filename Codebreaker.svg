<svg xmlns="http://www.w3.org/2000/svg" width="480" height="270" viewBox="0 0 480 270">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080d14"/>
      <stop offset="100%" stop-color="#0a121a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00ffa3" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="480" height="270" fill="url(#bg)" rx="16"/>
  <text x="240" y="135" text-anchor="middle" dominant-baseline="middle"
        font-family="Orbitron,sans-serif" font-size="72" font-weight="900" letter-spacing="6"
        fill="#00ffa3" filter="url(#glow)">
    CODE
  </text>
  <text x="240" y="175" text-anchor="middle" dominant-baseline="middle"
        font-family="Orbitron,sans-serif" font-size="28" font-weight="700" letter-spacing="4"
        fill="#ffcc00" opacity="0.9">
    BREAKER
  </text>
  <circle cx="240" cy="220" r="6" fill="#ff2a4d"/>
</svg>
